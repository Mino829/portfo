<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Page not found</title>
    <style>
      body { margin: 0; background: #eeede8; color: #171817; font: 16px/1.7 system-ui, sans-serif; }
      main { max-width: 38rem; margin: 16vh auto; padding: 2rem; }
      p:first-child { font-size: .8rem; letter-spacing: .16em; }
      h1 { font-size: clamp(2rem, 7vw, 4rem); line-height: 1.1; }
      a { color: inherit; text-underline-offset: .3em; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: .4rem; }
    </style>
  </head>
  <body>
    <main>
      <p>PORTFOLIO / 404</p>
      <h1>Page not found.</h1>
      <p>お探しのページは見つかりませんでした。</p>
      <a href="/">ホームに戻る / Back home</a>
    </main>
  </body>
</html>
